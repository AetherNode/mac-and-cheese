name: Refresh Mac and Cheese

on:
  schedule:
    - cron: '*/30 * * * 1-5'
    - cron: '0 12 * * 0,6'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/**', '.github/workflows/refresh.yml']

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch market data
        run: python engine/fetch.py
      - name: Fetch news headlines
        run: python engine/news.py
      - name: Score and build page
        run: mkdir -p engine/out && python engine/refresh.py
      - name: Prepare site
        run: |
          mkdir -p _site
          cp engine/out/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
